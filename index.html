<!DOCTYPE html>
<html lang="fr"> 
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Évite le flash blanc/texte noir avant le chargement de React : la page
         pré-rendue pour Google/robots contient du vrai texte (voir
         scripts/prerender.mjs), donc sans ceci on voit ce texte brut en noir
         sur blanc pendant une fraction de seconde. Ces couleurs reprennent
         exactement C.bg et C.text de App.jsx. -->
    <style>
      html,body{background:#07080e;color:#dce2f5;margin:0;font-family:'Plus Jakarta Sans','DM Sans',sans-serif;}
      /* Transition douce entre le HTML pré-rendu (affiché avant que React ne
         charge) et le rendu React qui le remplace : sans ça, le remplacement
         du contenu de #root est instantané et peut donner une impression de
         "saut". main.jsx passe l'opacité à 0 juste avant de monter React puis
         à 1 juste après, ce qui fait fondre l'un dans l'autre au lieu de
         sauter. Durée courte pour ne pas donner l'impression que le site est
         lent à charger. */
      #root{transition:opacity .22s ease;}
    </style>
    <!-- Permet au navigateur de commencer à télécharger le script React dès
         la lecture du <head>, en parallèle de l'affichage du HTML pré-rendu,
         au lieu d'attendre que le parseur atteigne la balise <script> en bas
         du <body>. Vite réécrit automatiquement ce href vers le vrai fichier
         buildé (ex: /assets/main-XXXX.js) au moment du build. */
    <link rel="modulepreload" href="/main.jsx" />
    <meta name="google-site-verification" content="yAr0G_72EVp6Y6ziKQsNGpH3xfNYtvZeIxuYsX-ioOA" />
    <meta name="msvalidate.01" content="6D40A046E88AF3E568DF9D97795ED16B" />

    <title>StudyReach — Recrutez des participants pour vos études</title>
    <meta name="description" content="Plateforme française pour recruter des participants rémunérés à vos études (UX, académique, marketing). Paiement sécurisé, sans abonnement." />
    <link rel="canonical" href="https://www.getstudyreach.com/" />

    <!-- Open Graph / partage LinkedIn, Facebook, WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StudyReach — Participants pour vos études de recherche" />
    <meta property="og:title" content="StudyReach — Recrutez des participants pour vos études" />
    <meta property="og:description" content="Plateforme française pour recruter des participants rémunérés à vos études (UX, académique, marketing). Paiement sécurisé, sans abonnement." />
    <meta property="og:url" content="https://www.getstudyreach.com/" />
    <meta property="og:image" content="https://www.getstudyreach.com/og-image.png?v=2" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyReach — Participants rémunérés pour vos études" />
    <meta name="twitter:description" content="Recrutez rapidement des participants qualifiés pour vos études de recherche en France." />
    <meta name="twitter:image" content="https://www.getstudyreach.com/og-image.png?v=2" />

    <!-- Données structurées (schema.org) — aide Google et les IA génératives à
         identifier précisément cette entité et à ne pas la confondre avec
         d'autres sociétés portant un nom proche ("StudyReach" étude à l'étranger,
         sans rapport). Sans ce balisage, les moteurs n'ont que le texte de la
         page pour deviner de qui il s'agit. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "StudyReach",
      "url": "https://www.getstudyreach.com/",
      "logo": "https://www.getstudyreach.com/og-image.png",
      "description": "StudyReach est une marketplace française qui connecte des chercheurs (académiques, UX, marketing, sciences humaines) avec des participants rémunérés pour des études qualitatives : entretiens, tests utilisateurs, questionnaires. StudyReach n'est pas affilié aux plateformes de recrutement d'étudiants internationaux portant un nom similaire.",
      "areaServed": "FR",
      "knowsLanguage": "fr",
      "email": "contact@getstudyreach.com",
      "sameAs": [
        "https://francesaas.fr/saas/studyreach",
        "https://www.producthunt.com/products/studyreach",
        "https://alternativeto.net/software/studyreach/about/",
        "https://lespepitestech.com/startup-de-la-french-tech/studyreach",
        "https://www.linkedin.com/in/contact-studyreach-8b9418424",
        "https://www.g2.com/products/studyreach/reviews"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "StudyReach",
      "alternateName": "StudyReach France — recrutement de participants d'études",
      "url": "https://www.getstudyreach.com/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <noscript>
      <a href="https://francesaas.fr/saas/studyreach" target="_blank" rel="noopener" title="Profil du SaaS StudyReach sur FranceSaaS.fr">
        <img src="https://francesaas.fr/badge-francesaas.svg" alt="Badge FranceSaaS" width="200" height="44">
      </a>
      <a href="https://www.producthunt.com/products/studyreach?utm_source=badge-follow&utm_medium=badge&utm_source=badge-studyreach" target="_blank" rel="noopener" title="StudyReach sur Product Hunt">
        <img src="https://api.producthunt.com/widgets/embed-image/v1/follow.svg?product_id=1276455&theme=neutral" alt="StudyReach - Recrutez des participants pour vos études | Product Hunt" width="250" height="54">
      </a>
    </noscript>
  </body>
</html>
